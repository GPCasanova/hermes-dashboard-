<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Asistente de Escritura</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0f172a; --surface: #1e293b; --text: #f8fafc; --text-muted: #94a3b8; --accent: #8b5cf6; --border: #334155; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        header { padding: 16px; border-bottom: 1px solid var(--border); background: rgba(15, 23, 42, 0.95); text-align: center; }
        h1 { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
        .container { flex: 1; padding: 16px; display: flex; flex-direction: column; max-width: 800px; margin: 0 auto; width: 100%; gap: 16px; }
        textarea { flex: 1; min-height: 250px; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 16px; border-radius: 12px; font-size: 0.95rem; font-family: inherit; line-height: 1.5; outline: none; resize: none; }
        textarea:focus { border-color: var(--accent); }
        .actions { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .btn { padding: 14px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; color: white; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.2s; font-family: inherit; }
        .btn-improve { background: #10b981; }
        .btn-translate { background: #3b82f6; }
        .btn-outline { background: #f59e0b; }
        .btn:active { opacity: 0.8; }
    </style>
</head>
<body>
    <header>
        <h1>✍️ Asistente de Escritura Científica</h1>
    </header>
    <div class="container">
        <textarea id="text-input" placeholder="Pega aquí tu abstract, párrafo o borrador..."></textarea>
        <div class="actions">
            <button class="btn btn-improve" onclick="enviar('improve')">✨ Mejorar Redacción</button>
            <button class="btn btn-translate" onclick="enviar('translate')">🇬🇧 Traducir a Inglés Científico</button>
            <button class="btn btn-outline" onclick="enviar('outline')">📝 Generar Esquema</button>
        </div>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        if (tg && tg.ready) { tg.ready(); tg.expand(); }
        function enviar(mode) {
            const text = document.getElementById('text-input').value.trim();
            if (!text) { alert("Pega un texto primero"); return; }
            if (!tg || !tg.sendData) { alert("Abre desde Telegram para usar esta función"); return; }
            tg.sendData(JSON.stringify({ action: "ai_writer", mode: mode, text: text }));
        }
    </script>
</body>
</html>
