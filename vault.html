<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hermes Vault</title>
    <!-- Usamos Marked.js para renderizar el Markdown bonito -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #0f172a; --surface: #1e293b; --text: #f8fafc;
            --text-muted: #94a3b8; --accent: #8b5cf6; --accent-hover: #7c3aed;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
        
        header { position: sticky; top: 0; width: 100%; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); z-index: 100; border-bottom: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
        .header-top { width: 100%; max-width: 600px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.25rem; font-weight: 700; }
        .badge-count { font-size: 0.75rem; background: var(--surface); border: 1px solid var(--border); padding: 4px 10px; border-radius: 20px; color: var(--text-muted); }
        
        .search-container { width: 100%; max-width: 600px; }
        .search-container input { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 12px; font-size: 0.95rem; outline: none; }
        
        .notes-list { width: 100%; max-width: 600px; padding: 16px; display: flex; flex-direction: column; gap: 12px; margin: 0 auto; }
        .note-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: 0.2s; }
        .note-card:hover { border-color: #475569; transform: translateY(-2px); }
        .note-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
        .note-title { font-size: 1.05rem; font-weight: 600; color: var(--text); }
        .note-folder { font-size: 0.7rem; color: var(--accent); background: rgba(139, 92, 246, 0.1); padding: 4px 8px; border-radius: 6px; white-space: nowrap; font-weight: 600; text-transform: uppercase; }
        .note-snippet { font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* Vista de Lectura (Lector) */
        #reader-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 200; display: none; flex-direction: column; }
        .reader-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
        .btn-close { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; padding: 0 10px; }
        .reader-content { padding: 20px; overflow-y: auto; flex: 1; max-width: 800px; margin: 0 auto; width: 100%; font-size: 1rem; line-height: 1.6; }
        .reader-content h1, .reader-content h2, .reader-content h3 { margin-top: 1.5em; margin-bottom: 0.5em; color: var(--accent); }
        .reader-content p { margin-bottom: 1em; }
        .reader-content a { color: #60a5fa; text-decoration: none; }
        .reader-content code { background: #000; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        .reader-content pre { background: #000; padding: 10px; border-radius: 8px; overflow-x: auto; margin-bottom: 1em; }
        .reader-content blockquote { border-left: 4px solid var(--accent); padding-left: 10px; color: #aaa; margin-bottom: 1em; }
        .btn-open-native { display: block; text-align: center; background: var(--accent); color: white; text-decoration: none; padding: 12px; border-radius: 10px; font-weight: 600; margin: 20px auto; max-width: 300px; }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <h1>🔮 Hermes Vault</h1>
            <div class="badge-count" id="count">Cargando...</div>
        </div>
        <div class="search-container">
            <input type="text" id="search" placeholder="🔍 Buscar en tus notas..." oninput="filterNotes()" autocomplete="off">
        </div>
    </header>

    <div class="notes-list" id="notes-list"></div>

    <!-- Lector Interno -->
    <div id="reader-view">
        <div class="reader-header">
            <button class="btn-close" onclick="closeReader()">✕</button>
            <div style="font-weight:600; font-size:1rem;" id="reader-title">Nota</div>
            <div style="width:30px;"></div> <!-- Espaciador -->
        </div>
        <div class="reader-content" id="reader-body"></div>
    </div>

    <script>
        let allNotes = [];
        const vaultName = "CDGePeCa";

        async function loadNotes() {
            try {
                const response = await fetch('vault.json?t=' + new Date().getTime());
                allNotes = await response.json();
                document.getElementById('count').innerText = allNotes.length + " notas";
                renderNotes(allNotes);
            } catch (e) {
                document.getElementById('notes-list').innerHTML = '<div style="text-align:center; color:red;">Error al cargar.</div>';
            }
        }

        function renderNotes(notes) {
            const list = document.getElementById('notes-list');
            if (notes.length === 0) { list.innerHTML = '<div style="text-align:center; color:#94a3b8;">No hay notas.</div>'; return; }
            
            list.innerHTML = notes.slice(0, 100).map((note, index) => `
                <div class="note-card" onclick="openReader(${index})">
                    <div class="note-header">
                        <div class="note-title">${note.title}</div>
                        <div class="note-folder">${note.folder}</div>
                    </div>
                    <div class="note-snippet">${note.snippet}</div>
                </div>
            `).join('');
        }

        function openReader(index) {
            const note = allNotes[index];
            document.getElementById('reader-title').innerText = note.title;
            
            // Convertir Markdown a HTML
            const htmlContent = marked.parse(note.content);
            const obsidianUrl = `obsidian://open?vault=${vaultName}&file=${encodeURIComponent(note.path)}`;
            
            document.getElementById('reader-body').innerHTML = `
                ${htmlContent}
                <a href="${obsidianUrl}" class="btn-open-native">📝 Editar en Obsidian</a>
            `;
            document.getElementById('reader-view').style.display = 'flex';
        }

        function closeReader() {
            document.getElementById('reader-view').style.display = 'none';
        }

        function filterNotes() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = allNotes.filter(n => 
                n.title.toLowerCase().includes(query) || n.snippet.toLowerCase().includes(query) || n.folder.toLowerCase().includes(query)
            );
            renderNotes(filtered);
        }

        loadNotes();
    </script>
</body>
</html>
