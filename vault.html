<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hermes Vault</title>
    <style>
        :root {
            --bg: #0f172a; /* Azul noche profundo */
            --surface: #1e293b; /* Color de tarjeta */
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #8b5cf6; /* Violeta premium */
            --accent-hover: #7c3aed;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Cabecera fija con efecto cristal */
        header {
            position: sticky;
            top: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            border-bottom: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .header-top {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.5px; }

        .badge-count {
            font-size: 0.75rem;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: 20px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .search-container {
            width: 100%;
            max-width: 600px;
            position: relative;
        }

        .search-container input {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-container input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
        }

        /* Lista de notas */
        .notes-list {
            width: 100%;
            max-width: 600px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .note-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: transform 0.2s ease, border-color 0.2s ease;
            animation: fadeIn 0.3s ease;
        }

        .note-card:hover {
            border-color: #475569;
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .note-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--text);
            line-height: 1.3;
        }

        .note-folder {
            font-size: 0.7rem;
            color: var(--accent);
            background: rgba(139, 92, 246, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            white-space: nowrap;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .note-snippet {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3; /* Limita a 3 líneas */
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .btn-open {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 4px;
            transition: background 0.2s ease;
        }

        .btn-open:hover { background: var(--accent-hover); }

        .loading, .empty-state {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
            font-size: 0.9rem;
        }

        /* Esqueleto de carga */
        .skeleton {
            background: linear-gradient(90deg, var(--surface) 25%, #2a374a 50%, var(--surface) 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 8px;
        }
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <h1>📚 Hermes Vault</h1>
            <div class="badge-count" id="count">Cargando...</div>
        </div>
        <div class="search-container">
            <input type="text" id="search" placeholder="🔍 Buscar en tus notas..." oninput="filterNotes()" autocomplete="off">
        </div>
    </header>

    <div class="notes-list" id="notes-list">
        <div class="note-card">
            <div class="skeleton" style="height: 24px; width: 60%;"></div>
            <div class="skeleton" style="height: 16px; width: 100%;"></div>
            <div class="skeleton" style="height: 16px; width: 80%;"></div>
            <div class="skeleton" style="height: 36px; width: 100%; margin-top: 8px;"></div>
        </div>
    </div>

    <script>
        let allNotes = [];
        const vaultName = "CDGePeCa";

        async function loadNotes() {
            try {
                const response = await fetch('vault.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Error al cargar');
                allNotes = await response.json();
                document.getElementById('count').innerText = allNotes.length + " notas";
                renderNotes(allNotes);
            } catch (e) {
                document.getElementById('notes-list').innerHTML = '<div class="empty-state">❌ Error al cargar las notas.</div>';
            }
        }

        function renderNotes(notes) {
            const list = document.getElementById('notes-list');
            if (notes.length === 0) {
                list.innerHTML = '<div class="empty-state">🔍 No se encontraron notas.</div>';
                return;
            }
            
            const toRender = notes.slice(0, 50);
            
            list.innerHTML = toRender.map(note => {
                const obsidianUrl = `obsidian://open?vault=${vaultName}&file=${encodeURIComponent(note.path)}`;
                return `
                <div class="note-card">
                    <div class="note-header">
                        <div class="note-title">${note.title}</div>
                        <div class="note-folder">${note.folder}</div>
                    </div>
                    <div class="note-snippet">${note.snippet}</div>
                    <a href="${obsidianUrl}" class="btn-open">📝 Abrir en Obsidian</a>
                </div>
                `;
            }).join('');
            
            if (notes.length > 50) {
                list.innerHTML += `<div class="empty-state">Mostrando 50 de ${notes.length} notas. Usa el buscador.</div>`;
            }
        }

        function filterNotes() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = allNotes.filter(n => 
                n.title.toLowerCase().includes(query) || 
                n.snippet.toLowerCase().includes(query) ||
                n.folder.toLowerCase().includes(query)
            );
            renderNotes(filtered);
        }

        loadNotes();
    </script>
</body>
</html>
