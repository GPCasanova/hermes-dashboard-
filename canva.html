<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hermes Canva</title>
    <style>
        :root { --bg: #0f172a; --surface: #1e293b; --text: #f8fafc; --text-muted: #94a3b8; --accent: #8b5cf6; --border: #334155; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
        header { position: sticky; top: 0; width: 100%; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); z-index: 100; border-bottom: 1px solid var(--border); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .header-top { display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 800px; margin: 0 auto; }
        h1 { font-size: 1.25rem; font-weight: 700; display: flex; align-items: center; gap: 8px;}
        .badge-count { font-size: 0.75rem; background: var(--surface); border: 1px solid var(--border); padding: 4px 10px; border-radius: 20px; color: var(--text-muted); }
        .toolbar { display: flex; gap: 8px; width: 100%; max-width: 800px; margin: 0 auto; overflow-x: auto; padding-bottom: 4px; }
        .btn-tool { flex: 1; display: flex; justify-content: center; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .btn-tool:hover { border-color: var(--accent); }
        .btn-tool.primary { background: var(--accent); color: white; border: none; }
        .search-container { width: 100%; max-width: 800px; margin: 0 auto; }
        .search-container input { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 10px 16px; border-radius: 10px; font-size: 0.95rem; outline: none; }
        .search-container input:focus { border-color: var(--accent); }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; padding: 16px; max-width: 800px; margin: 0 auto; width: 100%; }
        .design-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s ease; text-decoration: none; color: inherit; }
        .design-card:active { transform: scale(0.98); }
        .thumbnail-container { width: 100%; height: 200px; background: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .thumbnail-container img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .design-info { padding: 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .design-title { font-size: 0.85rem; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .btn-open { display: flex; justify-content: center; align-items: center; gap: 6px; width: 100%; background: rgba(139, 92, 246, 0.1); color: var(--accent); border: 1px solid var(--accent); padding: 8px; border-radius: 8px; font-size: 0.75rem; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: auto; }
        .empty-state { text-align: center; color: var(--text-muted); grid-column: 1 / -1; padding: 40px; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 200; }
        .modal-content { background: var(--surface); border: 1px solid var(--border); padding: 24px; border-radius: 16px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 16px; }
        .modal-content h2 { font-size: 1.2rem; margin-bottom: 8px; }
        .modal-content input, .modal-content select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 12px; border-radius: 8px; font-size: 1rem; outline: none; }
        .modal-buttons { display: flex; gap: 8px; margin-top: 8px; }
        .modal-buttons button { flex: 1; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem; border: none; }
        .btn-cancel { background: #333; color: white; }
        .btn-create { background: var(--accent); color: white; }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
            <h1>🎨 Mis Diseños</h1>
            <div class="badge-count" id="count">Cargando...</div>
        </div>
        <div class="toolbar">
            <button class="btn-tool primary" onclick="abrirModal()">➕ Crear</button>
            <button class="btn-tool" onclick="cargarDisenos()">🔄 Recargar</button>
            <button class="btn-tool" onclick="alert('Próximamente: Mi Cuenta')">👤 Cuenta</button>
        </div>
        <div class="search-container">
            <input type="text" id="search" placeholder="🔍 Buscar diseños..." oninput="filtrarDisenos()">
        </div>
    </header>
    <div class="grid-container" id="grid"></div>
    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h2>➕ Crear Nuevo Diseño</h2>
            <input type="text" id="new-title" placeholder="Título del diseño">
            <select id="new-type">
                <option value="InstagramPost">Post de Instagram (1080x1080)</option>
                <option value="FacebookPost">Post de Facebook (1200x630)</option>
                <option value="Poster">Póster (1587x2245)</option>
                <option value="Document">Documento (2480x3508)</option>
                <option value="presentation">Presentación</option>
            </select>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
                <button class="btn-create" onclick="crearDiseno()">Crear</button>
            </div>
        </div>
    </div>
    <script>
        const WORKER_URL = "https://canva-proxy.geisercasanova.workers.dev";
        let todosLosDisenos = [];
        async function cargarDisenos() {
            document.getElementById('grid').innerHTML = '<div class="empty-state">Cargando...</div>';
            try {
                const response = await fetch(`${WORKER_URL}/v1/designs`);
                if (!response.ok) throw new Error("Error");
                const data = await response.json();
                todosLosDisenos = data.items || [];
                document.getElementById('count').innerText = todosLosDisenos.length + " diseños";
                filtrarDisenos();
            } catch (e) {
                document.getElementById('grid').innerHTML = '<div class="empty-state">Error al cargar.</div>';
            }
        }
        function filtrarDisenos() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtrados = todosLosDisenos.filter(d => (d.title || "sin titulo").toLowerCase().includes(query));
            renderGrid(filtrados);
        }
        function renderGrid(disenos) {
            const grid = document.getElementById('grid');
            if (disenos.length === 0) { grid.innerHTML = '<div class="empty-state">No se encontraron diseños.</div>'; return; }
            grid.innerHTML = disenos.map(design => {
                const title = design.title || "Diseño sin título";
                const imgUrl = design.thumbnail?.url || 'https://via.placeholder.com/300x200/1e293b/94a3b8?text=Sin+Imagen';
                const editUrl = design.urls?.edit_url || '#';
                return `<a href="${editUrl}" target="_blank" class="design-card">
                        <div class="thumbnail-container"><img src="${imgUrl}" alt="${title}" loading="lazy"></div>
                        <div class="design-info"><div class="design-title">${title}</div><button class="btn-open">🎨 Abrir</button></div>
                    </a>`;
            }).join('');
        }
        function abrirModal() { document.getElementById('modal').style.display = 'flex'; }
        function cerrarModal() { document.getElementById('modal').style.display = 'none'; }
        async function crearDiseno() {
            const title = document.getElementById('new-title').value;
            const type = document.getElementById('new-type').value;
            if (!title) { alert("Pon un título"); return; }
            document.querySelector('.btn-create').innerText = "Creando...";
            try {
                const response = await fetch(`${WORKER_URL}/v1/designs`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title: title, design_type: type })
                });
                if (!response.ok) throw new Error("Error al crear");
                cerrarModal();
                document.querySelector('.btn-create').innerText = "Crear";
                document.getElementById('new-title').value = '';
                cargarDisenos();
            } catch (e) {
                alert("Error al crear el diseño.");
                document.querySelector('.btn-create').innerText = "Crear";
            }
        }
        cargarDisenos();
    </script>
</body>
</html>
