<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hermes Kanban</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0f172a;--surface:#1e293b;--text:#f8fafc;--muted:#94a3b8;--accent:#8b5cf6;--border:#334155;--col:#121e31;--green:#10b981;--red:#ef4444;--yellow:#fbbf24;--blue:#3b82f6;--gray:#64748b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:10px;background:rgba(15,23,42,.95);z-index:10}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:1.1rem;font-weight:700}
.toggle{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:10px;border:1px solid var(--border)}
.toggle button{flex:1;padding:8px;background:transparent;border:none;color:var(--muted);font-weight:600;font-size:.85rem;border-radius:8px;cursor:pointer;font-family:inherit}
.toggle button.active{background:var(--accent);color:white}
.toolbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.btn-tool{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:10px;font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap;font-family:inherit}
.btn-tool.primary{background:var(--accent);color:white;border-color:var(--accent)}
select{background:var(--surface);color:var(--text);border:1px solid var(--border);padding:8px 12px;border-radius:8px;font-size:.85rem;outline:none}
.board-container{display:flex;flex:1;overflow-x:auto;overflow-y:hidden;padding:14px;gap:14px;align-items:flex-start}
.column{background:var(--col);border:1px solid var(--border);border-radius:14px;min-width:250px;width:78vw;max-width:290px;display:flex;flex-direction:column;max-height:100%}
.column-header{padding:11px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--accent);text-transform:uppercase;font-size:.8rem}
.column-header.red{color:var(--red)}
.column-header.yellow{color:var(--yellow)}
.column-header.green{color:var(--green)}
.column-header.gray{color:var(--gray)}
.task-count{background:rgba(139,92,246,.2);padding:2px 8px;border-radius:12px;font-size:.7rem}
.task-list{padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:60px}
.task-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.task-card.overdue{border-color:var(--red)}
.task-title{font-size:.9rem;font-weight:600;line-height:1.3}
.task-meta{display:flex;justify-content:space-between;align-items:center;font-size:.7rem;color:var(--muted);gap:6px;flex-wrap:wrap}
.badge-board{background:var(--accent);color:white;padding:1px 5px;border-radius:4px;font-size:0.6rem;font-weight:600;text-transform:uppercase;margin-right:4px}
.task-id{font-family:monospace;background:#000;padding:1px 5px;border-radius:3px}
.task-date{font-size:.65rem;padding:2px 6px;background:rgba(255,255,255,.05);border-radius:4px}
.task-date.overdue{color:var(--red);font-weight:600}
.task-date.set{color:var(--green);font-weight:600}
.status-badge{padding:2px 8px;border-radius:10px;font-size:.65rem;font-weight:600;text-transform:uppercase}
.status-badge.ready,.status-badge.todo{background:rgba(59,130,246,.2);color:var(--blue)}
.status-badge.triage{background:rgba(139,92,246,.2);color:var(--accent)}
.status-badge.running{background:rgba(251,191,36,.2);color:var(--yellow)}
.status-badge.review{background:rgba(59,130,246,.2);color:var(--blue)}
.status-badge.blocked{background:rgba(239,68,68,.2);color:var(--red)}
.status-badge.scheduled{background:rgba(251,191,36,.2);color:var(--yellow)}
.status-badge.done{background:rgba(16,185,129,.2);color:var(--green)}
.status-badge.archived{background:rgba(100,116,139,.2);color:var(--gray)}
.task-actions{display:flex;gap:6px;margin-top:6px}
.btn-act{flex:1;background:transparent;border:1px solid var(--border);color:var(--text);padding:6px;border-radius:6px;font-size:.9rem;cursor:pointer}
.btn-act.ok{border-color:var(--green);color:var(--green)}
.btn-act.block{border-color:var(--red);color:var(--red)}
.btn-act.unblock{border-color:var(--yellow);color:var(--yellow)}
.btn-act.date{border-color:var(--accent);color:var(--accent)}.btn-act.nota{border-color:#fbbf24;color:#fbbf24}
.empty-col{text-align:center;color:var(--muted);font-size:.8rem;padding:20px}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);display:none;justify-content:center;align-items:center;z-index:200}
.modal-overlay.show{display:flex}
.modal-content{background:var(--surface);border:1px solid var(--border);padding:20px;border-radius:14px;width:90%;max-width:400px;display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow-y:auto}
.modal-content h2{font-size:1.1rem}
.modal-content label{font-size:.75rem;color:var(--muted);margin-bottom:-6px;margin-top:4px}
.modal-content input,.modal-content select,.modal-content textarea{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:8px;font-size:.95rem;outline:none;font-family:inherit}
.modal-buttons{display:flex;gap:8px;margin-top:6px}
.modal-buttons button{flex:1;padding:11px;border-radius:8px;font-weight:600;cursor:pointer;font-size:.9rem;border:none;font-family:inherit}
.btn-cancel{background:#333;color:white}
.btn-confirm{background:var(--accent);color:white}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Hermes Kanban</h1>
    <button class="btn-tool primary" onclick="openModal('tarea')">+ Task</button>
  </div>
  <div class="toggle">
    <button id="toggle-estado" class="active" onclick="setView('status')">Por Estado</button>
    <button id="toggle-fecha" onclick="setView('date')">Por Fecha</button>
  </div>
  <div class="row">
    <select id="board-select" onchange="renderBoard()"><option>Cargando...</option></select>
    <div class="toolbar">
      <button class="btn-tool" onclick="openModal('kanban')">K</button>
      <button class="btn-tool" onclick="openModal('proyecto')">P</button>
      <button class="btn-tool" onclick="openModal('carpeta')">F</button>
      <button class="btn-tool" onclick="openModal('vincular')">V</button>
    </div>
  </div>
</header>

<div class="board-container" id="board-container"></div>

<div class="modal-overlay" id="modal-tarea">
  <div class="modal-content">
    <h2>Nueva Task</h2>
    <label>Titulo</label>
    <input type="text" id="tarea-title" placeholder="Ej: Preparar presentacion">
    <label>Kanban</label>
    <select id="tarea-board"></select>
    <label>Prioridad</label>
    <select id="tarea-priority">
      <option value="normal">Normal</option>
      <option value="high">Alta</option>
      <option value="low">Baja</option>
    </select>
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal('tarea')">Cancelar</button>
      <button class="btn-confirm" onclick="enviar('tarea')">Crear</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-kanban">
  <div class="modal-content">
    <h2>Nuevo Kanban</h2>
    <label>Slug (sin espacios ni tildes)</label>
    <input type="text" id="kanban-slug" placeholder="Ej: tesis-doctoral">
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal('kanban')">Cancelar</button>
      <button class="btn-confirm" onclick="enviar('kanban')">Crear</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-proyecto">
  <div class="modal-content">
    <h2>Nuevo Proyecto</h2>
    <label>Nombre</label>
    <input type="text" id="proyecto-name" placeholder="Ej: Tesis doctoral">
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal('proyecto')">Cancelar</button>
      <button class="btn-confirm" onclick="enviar('proyecto')">Crear</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-carpeta">
  <div class="modal-content">
    <h2>Anadir Carpeta</h2>
    <label>Proyecto</label>
    <select id="carpeta-project"></select>
    <label>Ruta</label>
    <input type="text" id="carpeta-path" placeholder="/home/droidmaster/proyectos/tesis">
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal('carpeta')">Cancelar</button>
      <button class="btn-confirm" onclick="enviar('carpeta')">Anadir</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-vincular">
  <div class="modal-content">
    <h2>Vincular Kanban</h2>
    <label>Proyecto</label>
    <select id="vincular-project"></select>
    <label>Kanban</label>
    <select id="vincular-board"></select>
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal('vincular')">Cancelar</button>
      <button class="btn-confirm" onclick="enviar('vincular')">Vincular</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-bloquear">
  <div class="modal-content">
    <h2>Bloquear Task</h2>
    <label>Task</label>
    <input type="text" id="bloq-title" readonly style="color:var(--muted)">
    <label>Razon</label>
    <textarea id="bloq-reason" placeholder="Ej: esperando aprobacion" style="resize:vertical;min-height:60px"></textarea>
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal('bloquear')">Cancelar</button>
      <button class="btn-confirm" onclick="enviar('bloquear')">Bloquear</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-fecha">
  <div class="modal-content">
    <h2>Programar Fecha</h2>
    <label>Task</label>
    <input type="text" id="fecha-title" readonly style="color:var(--muted)">
    <label>Fecha de vencimiento</label>
    <input type="date" id="fecha-due">
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeModal('fecha')">Cancelar</button>
      <button class="btn-confirm" onclick="enviar('fecha')">Programar</button>
    </div>
  </div>
</div>
<script>
const tg = window.Telegram?.WebApp;
if (tg) tg.expand();
let kanbanData = {};
let boards = [];
let projects = [];
let blq = { id: null, board: null };
let fechaTarget = { id: null, board: null };
let currentView = 'status';

const COLUMNS_STATUS = [
  { label: 'Por Hacer', statuses: ['ready','todo','triage'], color: '' },
  { label: 'En Progreso', statuses: ['running','review'], color: '' },
  { label: 'En Espera', statuses: ['blocked','scheduled'], color: 'yellow' },
  { label: 'Completadas', statuses: ['done'], color: 'green' },
  { label: 'Archivadas', statuses: ['archived'], color: '' }
];

function getTodayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function populateSelects() {
  ['board-select','tarea-board','vincular-board'].forEach(id => {
    const sel = document.getElementById(id);
    if (!sel) return;
    sel.innerHTML = '';
    boards.forEach(b => {
      const o = document.createElement('option');
      o.value = b;
      o.text = (id === 'board-select') ? b.toUpperCase() : b;
      sel.appendChild(o);
    });
  });
  ['carpeta-project','vincular-project'].forEach(id => {
    const sel = document.getElementById(id);
    if (!sel) return;
    sel.innerHTML = '';
    if (projects.length === 0) {
      const o = document.createElement('option');
      o.value = ''; o.text = '(no hay proyectos)';
      sel.appendChild(o);
    } else {
      projects.forEach(p => {
        const o = document.createElement('option');
        o.value = p; o.text = p;
        sel.appendChild(o);
      });
    }
  });
}

async function loadKanban() {
  try {
    const r = await fetch('kanban.json?t=' + Date.now());
    kanbanData = await r.json();
    boards = kanbanData._boards || [];
    projects = kanbanData._projects || [];
    if (boards.length === 0) boards = ['default'];
    populateSelects();
    let init = boards[0];
    for (const b of boards) {
      if (Array.isArray(kanbanData[b]) && kanbanData[b].length > 0) { init = b; break; }
    }
    document.getElementById('board-select').value = init;
    renderBoard();
  } catch (e) {
    document.getElementById('board-container').innerHTML = '<div class="empty-col">Error al cargar.</div>';
  }
}

function setView(v) {
  currentView = v;
  document.getElementById('toggle-estado').classList.toggle('active', v === 'status');
  document.getElementById('toggle-fecha').classList.toggle('active', v === 'date');
  renderBoard();
}

function renderBoard() {
  const board = document.getElementById('board-select').value;
  const c = document.getElementById('board-container');
  const selector = document.getElementById('board-select');
  c.innerHTML = '';
  
  if (currentView === 'status') {
    selector.style.display = 'block';
    if (!board) return;
    const tasks = kanbanData[board] || [];
    COLUMNS_STATUS.forEach(col => {
      const filtered = tasks.filter(t => col.statuses.includes((t.status||'').toLowerCase()));
      c.innerHTML += renderCol(col.label, filtered, board, col.color, false);
    });
  } else {
    selector.style.display = 'none'; // Ocultar selector en vista global
    const today = getTodayStr();
    const g = { atrasadas: [], hoy: [], programadas: [], sinfecha: [], completadas: [] };
    
    // Recopilar tareas de TODOS los tableros
    boards.forEach(b => {
      const tasks = kanbanData[b] || [];
      tasks.forEach(t => {
        t._originBoard = b; // Etiquetar origen
        const st = (t.status || '').toLowerCase();
        if (st === 'done' || st === 'archived') { g.completadas.push(t); return; }
        const due = t.due_date;
        if (!due) { g.sinfecha.push(t); return; }
        if (due < today) g.atrasadas.push(t);
        else if (due === today) g.hoy.push(t);
        else g.programadas.push(t);
      });
    });
    
    c.innerHTML += renderCol('Atrasadas', g.atrasadas, null, 'red', true);
    c.innerHTML += renderCol('Hoy', g.hoy, null, 'yellow', true);
    c.innerHTML += renderCol('Programadas', g.programadas, null, 'green', true);
    c.innerHTML += renderCol('Sin fecha', g.sinfecha, null, 'gray', true);
    c.innerHTML += renderCol('Completadas', g.completadas, null, '', true);
  }
}

function renderCol(label, tasks, board, color, showDate) {
  let h = '<div class="column"><div class="column-header ' + color + '"><span>' + label + '</span><span class="task-count">' + tasks.length + '</span></div><div class="task-list">';
  if (tasks.length === 0) h += '<div class="empty-col">Sin tareas</div>';
  else tasks.forEach(t => h += renderCard(t, board, showDate));
  return h + '</div></div>';
}

function renderCard(t, board, showDate) {
  const titleSafe = (t.title || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
  const today = getTodayStr();
  const originB = t._originBoard || board; // Tablero de origen
  const overdue = t.due_date && t.due_date < today && !['done','archived'].includes((t.status||'').toLowerCase());
  
  let h = '<div class="task-card' + (overdue ? ' overdue' : '') + '">';
  h += '<div class="task-title">' + t.title + '</div>';
  h += '<div class="task-meta"><span class="task-id">' + t.id + '</span>';
  
  if (showDate) {
    h += '<span>';
    if (originB) h += '<span class="badge-board">' + originB + '</span>';
    if (t.due_date) h += ' <span class="task-date' + (overdue ? ' overdue' : ' set') + '">' + t.due_date + (overdue ? ' (!)' : '') + '</span>';
    h += '</span>';
  } else {
    h += '<span class="status-badge ' + t.status + '">' + t.status + '</span>';
  }
  
  h += '</div>';
  h += '<div class="task-actions">';
  h += '<button class="btn-act ok" onclick="completar(\'' + t.id + '\',\'' + originB + '\')">OK</button>';
  h += '<button class="btn-act block" onclick="abrirBloquear(\'' + t.id + '\',\'' + originB + '\',\'' + titleSafe + '\')">BLK</button>';
  h += '<button class="btn-act unblock" onclick="desbloquear(\'' + t.id + '\',\'' + originB + '\')">UNB</button>';
  h += '<button class="btn-act date" onclick="abrirFecha(\'' + t.id + '\',\'' + originB + '\',\'' + titleSafe + '\')">DATE</button>';
  h += '<button class="btn-act nota" onclick="enviarANota(\'' + t.id + '\',\'' + originB + '\',\'' + titleSafe + '\')">Nota</button>';
  h += '</div></div>';
  return h;
}

function openModal(id) { document.getElementById('modal-' + id).classList.add('show'); }
function closeModal(id) { document.getElementById('modal-' + id).classList.remove('show'); }

function enviar(tipo) {
  if (!tg) { alert('Abre desde Telegram'); return; }
  let p = null;
  if (tipo === 'tarea') {
    const t = document.getElementById('tarea-title').value.trim();
    if (!t) { alert('Falta titulo'); return; }
    p = { action: 'kanban_create', title: t, board: document.getElementById('tarea-board').value, priority: document.getElementById('tarea-priority').value };
  } else if (tipo === 'kanban') {
    const s = document.getElementById('kanban-slug').value.trim().toLowerCase();
    if (!/^[a-z0-9-]+$/.test(s)) { alert('Slug invalido'); return; }
    p = { action: 'kanban_board_create', slug: s };
  } else if (tipo === 'proyecto') {
    const n = document.getElementById('proyecto-name').value.trim();
    if (!n) { alert('Falta nombre'); return; }
    p = { action: 'project_create', name: n };
  } else if (tipo === 'carpeta') {
    const pr = document.getElementById('carpeta-project').value;
    const pa = document.getElementById('carpeta-path').value.trim();
    if (!pr || !pa) { alert('Faltan campos'); return; }
    p = { action: 'project_add_folder', project: pr, path: pa };
  } else if (tipo === 'vincular') {
    const pr = document.getElementById('vincular-project').value;
    const bd = document.getElementById('vincular-board').value;
    if (!pr || !bd) { alert('Faltan campos'); return; }
    p = { action: 'project_bind_board', project: pr, board: bd };
  } else if (tipo === 'bloquear') {
    const r = document.getElementById('bloq-reason').value.trim();
    if (!r) { alert('Falta razon'); return; }
    p = { action: 'kanban_block', task_id: blq.id, board: blq.board, reason: r };
  } else if (tipo === 'fecha') {
    const d = document.getElementById('fecha-due').value;
    if (!d) { alert('Falta fecha'); return; }
    p = { action: 'kanban_set_due', task_id: fechaTarget.id, due_date: d, board: fechaTarget.board };
  }
  if (!p) return;
  tg.sendData(JSON.stringify(p));
  tg.close();
}

function completar(id, board) {
  if (!tg) return;
  tg.sendData(JSON.stringify({ action: 'kanban_complete', task_id: id, board }));
  tg.close();
}
function desbloquear(id, board) {
  if (!tg) return;
  tg.sendData(JSON.stringify({ action: 'kanban_unblock', task_id: id, board }));
  tg.close();
}
function abrirBloquear(id, board, title) {
  blq = { id, board };
  document.getElementById('bloq-title').value = title;
  document.getElementById('bloq-reason').value = '';
  openModal('bloquear');
}
function abrirFecha(id, board, title) {
  fechaTarget = { id, board };
  document.getElementById('fecha-title').value = title;
  document.getElementById('fecha-due').value = '';
  openModal('fecha');
}

function enviarANota(id, board, title) {
  if (!tg) { alert('Abre desde Telegram'); return; }
  tg.sendData(JSON.stringify({ action: 'tarea_to_nota', task_id: id, title: title, board: board }));
  tg.close();
}

loadKanban();
</script>
</body>
</html>
