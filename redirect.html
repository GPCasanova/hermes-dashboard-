<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirigiendo a Obsidian...</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .container { padding: 20px; background: #1e293b; border-radius: 16px; border: 1px solid #334155; }
        h1 { font-size: 1.2rem; color: #8b5cf6; margin-bottom: 10px; }
        p { font-size: 0.9rem; color: #94a3b8; }
        a { display: inline-block; margin-top: 15px; background: #8b5cf6; color: white; text-decoration: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Abriendo en Obsidian...</h1>
        <p>Si no se abre automáticamente, pulsa el botón de abajo.</p>
        <a id="fallback-link" href="#">📝 Abrir en Obsidian</a>
    </div>

    <script>
        // Obtenemos los parámetros de la URL (vault y file)
        const params = new URLSearchParams(window.location.search);
        const vault = params.get('vault');
        const file = params.get('file');

        if (vault && file) {
            // Construimos el enlace de Obsidian
            const obsidianUrl = `obsidian://open?vault=${encodeURIComponent(vault)}&file=${encodeURIComponent(file)}`;
            
            // Configuramos el botón de respaldo
            document.getElementById('fallback-link').href = obsidianUrl;

            // Intentamos la redirección automática
            window.location.href = obsidianUrl;
        } else {
            document.querySelector('.container').innerHTML = '<h1>Error</h1><p>Faltan parámetros en el enlace.</p>';
        }
    </script>
</body>
</html>
