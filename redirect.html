<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Abriendo...</title></head>
<body style="background:#0f172a;color:#fff;">
<script>
    const params = new URLSearchParams(window.location.search);
    const vault = params.get('vault');
    const file = params.get('file');
    if (vault && file) {
        // location.replace hace que no se guarde en el historial (más rápido)
        window.location.replace(`obsidian://open?vault=${encodeURIComponent(vault)}&file=${encodeURIComponent(file)}`);
    }
</script>
</body>
</html>
