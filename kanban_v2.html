<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hermes Kanban</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg:#0f172a; --surface:#1e293b; --text:#f8fafc; --text-muted:#94a3b8; --accent:#8b5cf6; --border:#334155; --col-bg:#121e31; --green:#10b981; --red:#ef4444; --yellow:#fbbf24; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; background: rgba(15,23,42,.95); z-index: 10; }
        .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
        h1 { font-size: 1.15rem; font-weight: 700; }
        .toolbar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
        .btn-tool { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 10px; font-size: 0.8rem; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: inherit; }
        .btn-tool.primary { background: var(--accent); color: white; border-color: var(--accent); }
        select { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-size: 0.85rem; outline: none; }
        .board-container { display: flex; flex: 1; overflow-x: auto; overflow-y: hidden; padding: 14px; gap: 14px; align-items: flex-start; }
        .column { background: var(--col-bg); border: 1px solid var(--border); border-radius: 14px; min-width: 250px; width: 78vw; max-width: 290px; display: flex; flex-direction: column; max-height: 100%; }
        .column-header { padding: 11px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: 600; color: var(--accent); text-transform: uppercase; font-size: 0.8rem; }
        .task-count { background: rgba(139,92,246,.2); padding: 2px 8px; border-radius: 12px; font-size: 0.7rem; }
        .task-list { padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; min-height: 60px; }
        .task-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
        .task-title { font-size: 0.9rem; font-weight: 600; line-height: 1.3; }
        .task-meta { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); }
        .task-id { font-family: monospace; background: #000; padding: 1px 5px; border-radius: 3px; }
        .task-actions { display: flex; gap: 6px; margin-top: 6px; }
        .btn-act { flex: 1; background: transparent; border: 1px solid var(--border); color: var(--text); padding: 6px; border-radius: 6px; font-size: 0.9rem; cursor: pointer; }
        .btn-act.ok { border-color: var(--green); color: var(--green); }
        .btn-act.block { border-color: var(--red); color: var(--red); }
        .btn-act.unblock { border-color: var(--yellow); color: var(--yellow); }
        .empty-col { text-align: center; color: var(--text-muted); font-size: 0.8rem; padding: 20px; }
        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,.8); display:none; justify-content:center; align-items:center; z-index:200; }
        .modal-overlay.show { display: flex; }
        .modal-content { background: var(--surface); border: 1px solid var(--border); padding: 20px; border-radius: 14px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; max-height: 90vh; overflow-y: auto; }
        .modal-content h2 { font-size: 1.1rem; }
        .modal-content label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: -6px; margin-top: 4px; }
        .modal-content input, .modal-content select, .modal-content textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 8px; font-size: 0.95rem; outline: none; font-family: inherit; }
        .modal-content textarea { resize: vertical; min-height: 60px; }
        .modal-buttons { display: flex; gap: 8px; margin-top: 6px; }
        .modal-buttons button { flex: 1; padding: 11px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem; border: none; font-family: inherit; }
        .btn-cancel { background: #333; color: white; }
        .btn-confirm { background: var(--accent); color: white; }
        .hint { font-size: 0.7rem; color: var(--text-muted); font-style: italic; margin-top: -4px; }
    </style>
</head>
<body>
    <header>
        <div class="row">
            <h1>📋 Kanban</h1>
            <button class="btn-tool primary" onclick="openModal('tarea')">➕ Nueva</button>
        </div>
        <div class="row">
            <select id="board-select" onchange="cambiarTablero()"><option>Cargando...</option></select>
            <div class="toolbar">
                <button class="btn-tool" onclick="openModal('tablero')">📋</button>
                <button class="btn-tool" onclick="openModal('proyecto')">📁</button>
                <button class="btn-tool" onclick="openModal('carpeta')">📂</button>
                <button class="btn-tool" onclick="openModal('vincular')">🔗</button>
            </div>
        </div>
    </header>

    <div class="board-container" id="board-container"></div>

    <div class="modal-overlay" id="modal-tarea">
        <div class="modal-content">
            <h2>➕ Nueva Tarea</h2>
            <label>Título</label>
            <input type="text" id="tarea-title" placeholder="Ej: Preparar presentación">
            <label>Tablero</label>
            <select id="tarea-board"></select>
            <label>Prioridad</label>
            <select id="tarea-priority">
                <option value="normal">Normal</option>
                <option value="high">Alta</option>
                <option value="low">Baja</option>
            </select>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal('tarea')">Cancelar</button>
                <button class="btn-confirm" onclick="enviar('tarea')">Crear →</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-tablero">
        <div class="modal-content">
            <h2>📋 Nuevo Tablero</h2>
            <label>Slug (sin espacios ni tildes)</label>
            <input type="text" id="tablero-slug" placeholder="Ej: tesis-doctoral">
            <p class="hint">Solo minúsculas, números y guiones.</p>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal('tablero')">Cancelar</button>
                <button class="btn-confirm" onclick="enviar('tablero')">Crear →</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-proyecto">
        <div class="modal-content">
            <h2>📁 Nuevo Proyecto</h2>
            <label>Nombre</label>
            <input type="text" id="proyecto-name" placeholder="Ej: Tesis doctoral">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal('proyecto')">Cancelar</button>
                <button class="btn-confirm" onclick="enviar('proyecto')">Crear →</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-carpeta">
        <div class="modal-content">
            <h2>📂 Añadir Carpeta a Proyecto</h2>
            <label>Proyecto</label>
            <select id="carpeta-project"></select>
            <label>Ruta de la carpeta</label>
            <input type="text" id="carpeta-path" placeholder="/home/droidmaster/proyectos/tesis">
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal('carpeta')">Cancelar</button>
                <button class="btn-confirm" onclick="enviar('carpeta')">Añadir →</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-vincular">
        <div class="modal-content">
            <h2>🔗 Vincular Tablero a Proyecto</h2>
            <label>Proyecto</label>
            <select id="vincular-project"></select>
            <label>Tablero</label>
            <select id="vincular-board"></select>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal('vincular')">Cancelar</button>
                <button class="btn-confirm" onclick="enviar('vincular')">Vincular →</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-bloquear">
        <div class="modal-content">
            <h2>🚫 Bloquear Tarea</h2>
            <label>Tarea</label>
            <input type="text" id="bloq-title" readonly style="color: var(--text-muted)">
            <label>Razón del bloqueo</label>
            <textarea id="bloq-reason" placeholder="Ej: esperando aprobación del tutor"></textarea>
            <div class="modal-buttons">
                <button class="btn-cancel" onclick="closeModal('bloquear')">Cancelar</button>
                <button class="btn-confirm" onclick="enviar('bloquear')">Bloquear →</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        let kanbanData = {};
        let boards = [];
        let projects = [];
        let blq = { id: null, board: null };

        const COLUMNS_ORDER = ["ready", "in_progress", "blocked", "done"];
        const COLUMNS_LABELS = {
            "ready": "📌 Pendientes",
            "in_progress": "⏳ En Progreso",
            "blocked": "🚫 Bloqueadas",
            "done": "✅ Completadas"
        };

        function populateSelects() {
            // Select de tablero principal
            const selBoard = document.getElementById('board-select');
            selBoard.innerHTML = '';
            boards.forEach(b => {
                const o = document.createElement('option');
                o.value = b; o.text = b.toUpperCase();
                selBoard.appendChild(o);
            });

            // Select de tablero en "Nueva Tarea"
            const tareaBoard = document.getElementById('tarea-board');
            tareaBoard.innerHTML = '';
            boards.forEach(b => {
                const o = document.createElement('option');
                o.value = b; o.text = b;
                tareaBoard.appendChild(o);
            });

            // Select de tablero en "Vincular"
            const vincBoard = document.getElementById('vincular-board');
            vincBoard.innerHTML = '';
            boards.forEach(b => {
                const o = document.createElement('option');
                o.value = b; o.text = b;
                vincBoard.appendChild(o);
            });

            // Selects de proyecto (carpeta y vincular)
            ['carpeta-project', 'vincular-project'].forEach(id => {
                const sel = document.getElementById(id);
                sel.innerHTML = '';
                if (projects.length === 0) {
                    const o = document.createElement('option');
                    o.value = ''; o.text = '(no hay proyectos)';
                    sel.appendChild(o);
                } else {
                    projects.forEach(p => {
                        const o = document.createElement('option');
                        o.value = p; o.text = p;
                        sel.appendChild(o);
                    });
                }
            });
        }

        async function loadKanban() {
            try {
                const r = await fetch('kanban.json?t=' + Date.now());
                kanbanData = await r.json();
                boards = kanbanData._boards || [];
                projects = kanbanData._projects || [];

                if (boards.length === 0) boards = ["default"];
                populateSelects();

                // Seleccionar el primer board que tenga tareas, o el primero
                let boardInicial = boards[0];
                for (const b of boards) {
                    if (Array.isArray(kanbanData[b]) && kanbanData[b].length > 0) {
                        boardInicial = b; break;
                    }
                }
                document.getElementById('board-select').value = boardInicial;

                cambiarTablero();
            } catch (e) {
                document.getElementById('board-container').innerHTML = '<div class="empty-col">Error al cargar.</div>';
            }
        }

        function cambiarTablero() {
            const board = document.getElementById('board-select').value;
            const c = document.getElementById('board-container');
            c.innerHTML = '';
            if (!board) return;
            const tasks = kanbanData[board] || [];
            const g = {};
            tasks.forEach(t => { const s = t.status.toLowerCase(); if (!g[s]) g[s]=[]; g[s].push(t); });

            // Renderizar TODAS las columnas (aunque estén vacías)
            COLUMNS_ORDER.forEach(s => {
                c.innerHTML += renderCol(s, g[s] || [], board);
            });
        }

        function renderCol(status, tasks, board) {
            const label = COLUMNS_LABELS[status];
            let h = `<div class="column"><div class="column-header"><span>${label}</span><span class="task-count">${tasks.length}</span></div><div class="task-list">`;
            if (tasks.length === 0) {
                h += `<div class="empty-col">Sin tareas</div>`;
            } else {
                tasks.forEach(t => {
                    const titleSafe = (t.title || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    h += `<div class="task-card">
                        <div class="task-title">${t.title}</div>
                        <div class="task-meta"><span class="task-id">${t.id}</span><span>👤 ${t.assignee || '-'}</span></div>
                        <div class="task-actions">
                            <button class="btn-act ok" onclick="completar('${t.id}','${board}')">✅</button>
                            <button class="btn-act block" onclick="abrirBloquear('${t.id}','${board}','${titleSafe}')">🚫</button>
                            <button class="btn-act unblock" onclick="desbloquear('${t.id}','${board}')">▶️</button>
                        </div>
                    </div>`;
                });
            }
            return h + '</div></div>';
        }

        function openModal(id) { document.getElementById('modal-' + id).classList.add('show'); }
        function closeModal(id) { document.getElementById('modal-' + id).classList.remove('show'); }

        function enviar(tipo) {
            if (!tg) { alert('Abre esto desde Telegram'); return; }
            let payload = null;

            if (tipo === 'tarea') {
                const title = document.getElementById('tarea-title').value.trim();
                if (!title) { alert('Falta el título'); return; }
                payload = {
                    action: 'kanban_create', title,
                    board: document.getElementById('tarea-board').value,
                    priority: document.getElementById('tarea-priority').value
                };
            } else if (tipo === 'tablero') {
                const slug = document.getElementById('tablero-slug').value.trim().toLowerCase();
                if (!/^[a-z0-9-]+$/.test(slug)) { alert('Slug inválido (a-z, 0-9, guiones)'); return; }
                payload = { action: 'kanban_board_create', slug };
            } else if (tipo === 'proyecto') {
                const name = document.getElementById('proyecto-name').value.trim();
                if (!name) { alert('Falta el nombre'); return; }
                payload = { action: 'project_create', name };
            } else if (tipo === 'carpeta') {
                const project = document.getElementById('carpeta-project').value;
                const path = document.getElementById('carpeta-path').value.trim();
                if (!project || !path) { alert('Faltan campos'); return; }
                payload = { action: 'project_add_folder', project, path };
            } else if (tipo === 'vincular') {
                const project = document.getElementById('vincular-project').value;
                const board = document.getElementById('vincular-board').value;
                if (!project || !board) { alert('Faltan campos'); return; }
                payload = { action: 'project_bind_board', project, board };
            } else if (tipo === 'bloquear') {
                const reason = document.getElementById('bloq-reason').value.trim();
                if (!reason) { alert('Falta la razón'); return; }
                payload = { action: 'kanban_block', task_id: blq.id, board: blq.board, reason };
            }

            if (!payload) return;
            tg.sendData(JSON.stringify(payload));
            tg.close();
        }

        function completar(id, board) {
            if (!tg) return;
            tg.sendData(JSON.stringify({ action: 'kanban_complete', task_id: id, board }));
            tg.close();
        }
        function desbloquear(id, board) {
            if (!tg) return;
            tg.sendData(JSON.stringify({ action: 'kanban_unblock', task_id: id, board }));
            tg.close();
        }
        function abrirBloquear(id, board, title) {
            blq = { id, board };
            document.getElementById('bloq-title').value = title;
            document.getElementById('bloq-reason').value = '';
            openModal('bloquear');
        }

        loadKanban();
    </script>
</body>
</html>
